<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Epicurean — Gestão de Restaurante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras (acessibilidade em Libras) — presente em todas as telas -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <!-- Init no onload do próprio script: garante que window.VLibras já existe
         (não depende do evento 'load' da página, que pode disparar antes). -->
    <script
      src="https://vlibras.gov.br/app/vlibras-plugin.js"
      onload="new window.VLibras.Widget('https://vlibras.gov.br/app');"
    ></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
